name: build-apk
on:
  workflow_dispatch:
    inputs:
      game_id: { required: true }
      game_name: { required: true }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Prepare game
        run: |
          mkdir -p android/app/src/main/assets
          cp "games/${{ inputs.game_id }}.json" android/app/src/main/assets/game.json
          NAME=$(echo "${{ inputs.game_name }}" | sed 's/[&<>/\\]//g')
          sed -i "s|__APP_NAME__|$NAME|" android/app/src/main/res/values/strings.xml
          sed -i "s|__APP_ID__|g${{ inputs.game_id }}|" android/app/build.gradle
      - name: Build
        run: gradle -p android assembleDebug --no-daemon
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: game-${{ inputs.game_id }}-${{ github.run_number }}
          name: ${{ inputs.game_name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
